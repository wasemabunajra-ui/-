<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور الساهر - لوحة الإدارة</title>
    <!-- مكتبة توليد الـ QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --gold: #D4AF37;
            --gold-light: #f3e5ab;
            --text-color: #ffffff;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
            text-align: center;
        }
        .header h1 { color: var(--gold); font-size: 24px; margin-bottom: 5px; }
        .header p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #0a0e14;
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }
        .action-btn {
            background: linear-gradient(135deg, #D4AF37, #aa8c2c);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .login-section.hidden { display: none; }
        .qr-box-wrapper {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            display: inline-block;
            margin: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #qrcode { display: flex; justify-content: center; align-items: center; }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>عطور الساهر</h1>
            <p>لوحة تحكم صاحب المحل</p>
        </div>

        <div class="login-section" id="loginSection">
            <div class="login-box">
                <input type="password" id="adminPass" placeholder="أدخل كلمة مرور الإدارة">
                <button class="action-btn" onclick="checkLogin()">دخول لوحة التحكم</button>
                <div class="error-msg" id="errorMsg">كلمة المرور غير صحيحة! (الافتراضية: saher1234)</div>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <p style="color: var(--gold); margin-bottom: 5px; font-weight: bold;">لوحة الإدارة نشطة ✅</p>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">امسح هذا الرمز ببطاقة العميل لإضافة الختم:</p>
            
            <div class="qr-box-wrapper">
                <div id="qrcode"></div>
            </div>

            <p id="tokenText" style="font-size: 11px; color: var(--text-muted); margin-bottom: 15px; word-break: break-all;"></p>
            
            <button class="action-btn" onclick="generateNewQR()">توليد باركود جديد للأختام</button>
        </div>
    </div>

    <script>
        const CORRECT_PASS = "saher1234";

        function checkLogin() {
            const enteredPass = document.getElementById('adminPass').value;
            if (enteredPass === CORRECT_PASS) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.add('active');
                generateNewQR();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function generateNewQR() {
            document.getElementById('qrcode').innerHTML = ""; 
            
            // توليد كود يبدأ بـ ALSAHER_STAMP_ متبوع برقم عشوائي ووقت (ليكون امتداد الساهر ثابت والأرقام متغيرة لمنع التلاعب)
            const uniqueRandomCode = "ALSAHER_STAMP_" + Math.floor(Math.random() * 900000 + 100000) + "_" + Date.now();
            
            document.getElementById('tokenText').innerText = "معرّف الباركود الحالي: " + uniqueRandomCode;

            new QRCode(document.getElementById("qrcode"), {
                text: uniqueRandomCode,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
